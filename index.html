<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alish · IT Helpdesk</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17243a;font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;height:100vh;padding:16px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6ebf2;padding-bottom:10px}
.badge{font-size:12px;padding:4px 10px;border-radius:12px;background:#fff;border:1px solid #e6ebf2}
#chat{flex:1;overflow:auto;background:#fff;border:1px solid #e6ebf2;border-radius:12px;padding:14px}
.msg{margin-bottom:12px;padding:10px 12px;border-radius:10px;background:#f4f6fa;max-width:85%;white-space:pre-wrap}
.user{margin-left:auto;background:#eaf0ff}.tool{font:12px monospace;background:#f5f8ff;border:1px solid #dce6ff;padding:8px;border-radius:8px;margin-bottom:10px}
.err{background:#fff3f2;border-color:#f2d2cf;color:#9c3434}.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button,button{border:1px solid #dfe5ef;background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
form{display:flex;gap:8px}input{flex:1;padding:10px;border:1px solid #e6ebf2;border-radius:8px;font:inherit}
.send{background:#345eea;color:#fff;border:0;font-weight:700}footer{font-size:11px;color:#8b96a7;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header><strong>Alish · IT Helpdesk</strong><span id="st" class="badge">Connecting…</span></header>
  <div id="chat">Ask about VPN, passwords, or software.</div>
  <div class="chips">
    <button data-p="Can I share my password with the helpdesk?">Password policy</button>
    <button data-p="My VPN keeps disconnecting. Please create a high-priority ticket.">Create mock ticket</button>
    <button data-p="What was the issue in the ticket I just created?">Check memory</button>
  </div>
  <form id="f"><input id="m" maxlength="2000" placeholder="Type your message…"><button type="button" id="rst">Reset</button><button class="send" id="sb">Send</button></form>
  <footer>Demo only: tickets are in-memory mocks and never sent to a real IT system.</footer>
</div>
<script>
const $=s=>document.querySelector(s),chat=$('#chat'),st=$('#st'),m=$('#m'),sb=$('#sb');
let ws,cur=null,busy=false;
function add(cls,txt){const d=document.createElement('div');d.className=cls;d.textContent=txt;chat.append(d);chat.scrollTop=chat.scrollHeight;return d;}
function connect(){
  ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/chat`);
  ws.onopen=()=>st.textContent='Connected';ws.onclose=()=>st.textContent='Disconnected';ws.onerror=()=>st.textContent='Error';
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type==='token'){if(!cur)cur=add('msg','Alish: ');cur.textContent+=d.content||'';chat.scrollTop=chat.scrollHeight;}
    else if(d.type==='tool_call')add('tool',`[Tool] ${d.name}(${JSON.stringify(d.arguments)})`);
    else if(d.type==='tool_result')add('tool',`[Result] ${JSON.stringify(d.result)}`);
    else if(d.type==='error'){add('tool err',d.content);busy=sb.disabled=false;cur=null;}
    else if(d.type==='done'){cur=null;busy=sb.disabled=false;m.focus();}
  };
}
function send(t){if(!t.trim()||busy||ws?.readyState!==1)return;add('msg user','You: '+t.trim());ws.send(JSON.stringify({message:t.trim()}));busy=sb.disabled=true;m.value='';}
$('#f').onsubmit=e=>{e.preventDefault();send(m.value);};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>send(b.dataset.p));
$('#rst').onclick=()=>{ws?.close();chat.textContent='Ask about VPN, passwords, or software.';cur=null;busy=sb.disabled=false;connect();};
connect();
</script>
</body>
</html>
